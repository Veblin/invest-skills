name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release archive
        run: |
          rm -rf dist/pkg
          mkdir -p dist/pkg/skills
          cp -r \
            .claude-plugin \
            .agents \
            hooks \
            docs \
            .workbuddy \
            skills.yaml \
            gemini-extension.json \
            pyproject.toml \
            README.md \
            AGENTS.md \
            CONFIGURATION.md \
            CHANGELOG.md \
            CONTRIBUTORS.md \
            CODE_OF_CONDUCT.md \
            SECURITY.md \
            .env.example \
            LICENSE \
            dist/pkg/
          # 公开技能 + 共享 lib **保留 skills/ 源布局**（包内路径=仓库路径）：
          # .claude-plugin/plugin.json 的 "skills": "./skills"、.agents/ 与
          # .workbuddy 技能链接（../../skills/<name>）以及 README/docs 的
          # skills/<name>/scripts/<cli>.py 命令都按该布局解析；旧版把 skills/X
          # 平铺到包根导致 ./skills 缺失、技能链接悬空。invest-a-event-calendar
          # 已退出公开分发，不在此清单。
          cp -r \
            skills/lib \
            skills/invest-a-stock \
            skills/invest-a-gap-scan \
            skills/invest-a-journal \
            skills/invest-a-etf \
            skills/invest-a-pulse \
            skills/invest-a-pattern-scan \
            skills/invest-hk-stock \
            skills/invest-a-discover-scan \
            dist/pkg/skills/
          # 运行期产物与测试不得进入发布包：tests/、reports/、缓存与编译产物
          # 在打包前统一清除（旧版仅清 __pycache__ 且路径按压扁布局写错）。
          find dist/pkg \( \
            -name '__pycache__' -o -name 'tests' -o -name 'reports' \
            -o -name '.pytest_cache' -o -name '*.pyc' -o -name '*.pyo' \
            -o -name '.DS_Store' \
            \) -prune -exec rm -rf {} +
          rm -rf dist/pkg/.venv
          cd dist && tar -czf invest-skills-${{ github.ref_name }}.tar.gz -C pkg .
          rm -rf pkg   # 相对 dist（上一步已 cd）——旧版写 dist/pkg 为 no-op，残包污染重跑
          echo "Archive created: dist/invest-skills-${{ github.ref_name }}.tar.gz"

      - name: Build WorkBuddy bundle zip
        run: |
          bash scripts/build_wb_package.sh
          # 安全闸：zip 名须与 tag 一致（防止 pyproject 版本与 tag 漂移）
          test -f "dist/invest-skills-wb-${{ github.ref_name }}.zip" \
            || { echo "❌ WB zip 名与 tag 不一致（pyproject 版本 ≠ ${{ github.ref_name }}）"; exit 1; }
          echo "Bundle created: dist/invest-skills-wb-${{ github.ref_name }}.zip"

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          python3 .github/scripts/extract_release_notes.py "${{ github.ref_name }}" > release-notes.md
          echo "-----"
          head -20 release-notes.md
          echo "-----"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/invest-skills-${{ github.ref_name }}.tar.gz
            dist/invest-skills-wb-${{ github.ref_name }}.zip
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: true
