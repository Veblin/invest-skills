# 商品期货 → A股 联动映射表（invest-a-futures-link）
#
# 维护约定（2026-09-08 初版，待用户审核）：
#   - 收录「公认有产业逻辑的联动链」——期货价格与公司基本面同源（收入/成本/
#     库存周期），非统计相关性筛选结果
#   - relation: positive = 期货涨利好公司（产品/收入端）；cost_inverse = 期货是
#     公司成本端（期货涨利空，方向相反——扫描输出取反后标注）。
#     链级 cost_inverse 现有两条：豆粕链（海大/牧原为下游采购方，2026-09-08 F5）
#     与橡胶链（轮胎厂成本端，2026-09-10 R1 修正）；尿素链华鲁恒升/云天化为
#     尿素生产商（收入端），属 positive
#   - 成员级覆盖（2026-09-10 R0 审查 F11）：个股可带 relation 覆盖链默认值——
#     混合链成员方向相反时使用（原油链：上游中石油属收入端、炼化中石化/荣盛属
#     成本端；工业硅链：合盛硅业为生产商、大全能源为下游采购方）。
#     修正记录：橡胶链此前误标 positive（玲珑/赛轮为轮胎厂，橡胶是成本端）→
#     链级改 cost_inverse
#   - stocks 直接固化代码（运行时名称解析依赖深交所接口，2026-09-08 实测超时
#     不可用，故弃用）；name 仅作展示。退市/重组时人工更新
#   - symbol 为新浪主力连续代码（futures_main_sina），后缀 0 = 主力合约

chains:
  - id: sugar
    label: 食糖链
    symbol: SR0
    commodity: 郑糖主力
    relation: positive
    stocks:
      - {name: 中粮糖业, code: "600737"}
      - {name: 广农糖业, code: "000911"}

  - id: cu
    label: 铜链
    symbol: CU0
    commodity: 沪铜主力
    relation: positive
    stocks:
      - {name: 江西铜业, code: "600362"}
      - {name: 铜陵有色, code: "000630"}
      - {name: 紫金矿业, code: "601899"}

  - id: au
    label: 黄金链
    symbol: AU0
    commodity: 沪金主力
    relation: positive
    stocks:
      - {name: 山东黄金, code: "600547"}
      - {name: 中金黄金, code: "600489"}
      - {name: 赤峰黄金, code: "600988"}

  - id: sc
    label: 原油炼化链
    symbol: SC0
    commodity: 原油主力
    relation: positive          # 链默认=上游收入端；炼化成员成本端为负向，逐成员覆盖
    stocks:
      - {name: 中国石油, code: "601857"}                                   # 上游（收入端）
      - {name: 中国石化, code: "600028", relation: cost_inverse}          # 炼化（原油=成本端）
      - {name: 荣盛石化, code: "002493", relation: cost_inverse}          # 炼化（原油=成本端）

