# compliance_rules.yaml — invest:a-stock 合规扫描规则
# 单数据源：从 CLAUDE.md 措辞规范自动编码
# scope: line → 逐行正则匹配 | file → 全文扫描 | paragraph → 段级分析
schema_version: "0.1.9"
description: "invest:a-stock 合规扫描规则（从 CLAUDE.md 措辞规范、已知违规模式、估值分位规则、分析标记规范编码）"

rules:
  # ==========================================================================
  # LAW 6 — 禁止买卖建议、目标价、仓位建议
  # ==========================================================================
  - id: "law6-buy-advice"
    pattern: "建议买入"
    severity: "error"
    scope: "line"
    message: "禁止使用'建议买入'（LAW 6）"
    law_ref: "LAW 6"

  - id: "law6-sell-advice"
    pattern: "建议卖出"
    severity: "error"
    scope: "line"
    message: "禁止使用'建议卖出'（LAW 6）"
    law_ref: "LAW 6"

  - id: "law6-hold-advice"
    pattern: "建议持有"
    severity: "error"
    scope: "line"
    message: "禁止使用'建议持有'（LAW 6）"
    law_ref: "LAW 6"

  - id: "law6-buy-standalone"
    # 全量审查补充：排除两融数据字段/统计描述语境（融资买入额、买入 5 日均值、
    # 买入强度/环比等为引擎指标描述非建议词——2026-09-03 pulse 报告检验实证误报）
    pattern: "(?<!在)(?<!不)(?<!建议)(?<!融资)买入(?!成本|价格|价|时点|信号|机会|逻辑|力度|量|意愿|金额|均价|股份|资产|返售|返租|返利|返点|返期|返债|返基金|返保险|成交|强度|增加|环比|回升|动能|双维度|\\s*\\d)"
    severity: "error"
    scope: "line"
    message: "禁止使用'买入'建议词汇（LAW 6）"
    law_ref: "LAW 6"

  - id: "law6-sell-standalone"
    pattern: "(?<!在)(?<!不)(?<!建议)卖出(?!量|金额|均价|收入|资产|股份|价格|信号|机会|时点|逻辑|力度|意愿)"
    severity: "error"
    scope: "line"
    message: "禁止使用'卖出'建议词汇（LAW 6）"
    law_ref: "LAW 6"

  - id: "law6-hold-standalone"
    pattern: "(?<!在)(?<!不)(?<!建议)持有(?!人|股|比例|量|成本|期间|期|者|方|仓|单|证|券|债|基金|保险|资产|股份|股票)"
    severity: "error"
    scope: "line"
    message: "禁止使用'持有'建议词汇（LAW 6）"
    law_ref: "LAW 6"

  - id: "law6-target-price"
    pattern: "目标价\\s*[：:]*\\s*\\d+[\\.\\d]*"
    severity: "error"
    scope: "line"
    message: "禁止给出单一目标价（LAW 6），应提供估值区间"
    law_ref: "LAW 6"

  - id: "law6-position-advice"
    pattern: "(建议|考虑|可以)(加仓|减仓|建仓|清仓|重仓|轻仓)"
    severity: "error"
    scope: "line"
    message: "禁止仓位建议（LAW 6）"
    law_ref: "LAW 6"

  # ==========================================================================
  # LAW 16 — 禁止单一"左侧/右侧"结论
  # ==========================================================================
  - id: "law16-left-right-standalone"
    pattern: "[。，；.!;，]?(处于|属于)(左侧|右侧)[。，；.!;，]?$"
    severity: "warning"
    scope: "line"
    message: "禁止单一'左侧/右侧'结论，需标注概率（LAW 16）。正确写法：'左侧特征更强：XXXX；右侧支撑：YYYY。综合概率：左偏（≈60% vs 40%）'"
    law_ref: "LAW 16"

  - id: "law16-current-left-right"
    pattern: "当前处于(左侧|右侧)"
    severity: "warning"
    scope: "line"
    message: "禁止单一'当前处于左侧/右侧'（LAW 16），需标注概率分布"
    law_ref: "LAW 16"

  # ==========================================================================
  # 措辞规范 — 禁止词与替换表
  # ==========================================================================
  - id: "wording-valuation-collapse"
    pattern: "估值崩溃风险"
    severity: "warning"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|⚠️|\\[来源:)"
    message: "禁止使用'估值崩溃风险'，替换为'剧烈估值收缩风险：在 XXX 场景下，估值从 AAAx 收敛至 BBBx'"
    law_ref: "措辞规范 — 风险模块"

  - id: "wording-classic-top"
    pattern: "经典周期顶部信号"
    severity: "warning"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|⚠️|\\[来源:)"
    message: "禁止使用'经典周期顶部信号'，需具体描述行为模式并附历史案例"
    law_ref: "措辞规范 — 动态驱动"

  - id: "wording-extreme-high"
    pattern: "极度高估"
    severity: "warning"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|⚠️|\\[来源:)"
    message: "禁止使用'极度高估'，改为数值比较：'PE 665x vs 同赛道平均 40x，溢价约 16 倍'"
    law_ref: "措辞规范 — 估值段落"

  - id: "wording-extreme-low"
    pattern: "极度低估"
    severity: "warning"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|⚠️|\\[来源:)"
    message: "禁止使用'极度低估'，改为数值比较"
    law_ref: "措辞规范 — 估值段落"

  - id: "wording-crash"
    pattern: "崩盘"
    severity: "warning"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|⚠️|\\[来源:)"
    message: "禁止使用'崩盘'，替换为'剧烈回调'+条件描述"
    law_ref: "措辞规范 — 任何场景"

  - id: "wording-peak-value-estimate"
    pattern: "往往是估值峰值"
    severity: "warning"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|⚠️|\\[来源:)"
    message: "禁止使用'往往是估值峰值'，需附历史案例：'在多次周期品历史走势中…但并非必然规律'"
    law_ref: "措辞规范 — 市场结构"

  - id: "wording-quick-correction"
    pattern: "往往伴随.*修正"
    severity: "warning"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|⚠️|\\[来源:)"
    message: "禁止无据'往往伴随'表述，需附案例：'在 AAA、BBB 等类似斜率的高涨中，随后 N 个月内出现 20-30% 回调（案例研究待补）'"
    law_ref: "措辞规范 — 技术结构"

  - id: "wording-certain-price-drop"
    pattern: "股价也可能下跌\\s*\\d+(?:-\\d+)?%"
    severity: "warning"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|⚠️|\\[来源:)"
    skip_if_pattern_within_window: "(若|如果|假设|情景|scenario)"
    context_before: 2
    context_after: 2
    message: "禁止无条件'股价也可能下跌 X%'，需改为：'若盈利路径不及 AAA 预测、且估值回到周期中枢 BBBx，则与当前市值相比，价格有 X% 的回调空间'"
    law_ref: "措辞规范 — 风险模块"

  # ==========================================================================
  # LAW 3 — 口头经验须标注来源（"往往""通常"无来源）
  # ==========================================================================
  - id: "law3-wangwang-unqualified"
    pattern: "[。，；]?往往[不]?(伴随|在|是|有|会|出现|高于|低于|处于|位于|大于|小于)"
    severity: "info"
    scope: "line"
    message: "'往往'需标注数据来源或转为具体案例（LAW 3），避免无依据口头经验"
    law_ref: "LAW 3"

  - id: "law3-tongchang-unqualified"
    pattern: "[。，；]?通常[不]?(伴随|在|是|有|会|出现|高于|低于|处于|位于|大于|小于)"
    severity: "info"
    scope: "line"
    message: "'通常'需标注数据来源或转为具体案例（LAW 3），避免无依据口头经验"
    law_ref: "LAW 3"

  # ==========================================================================
  # 估值分位使用规则
  # ==========================================================================
  - id: "percentile-without-median"
    # 检验修正（2026-09-03 pulse 报告）：scope paragraph → line + 限定 PE/PB
    # 语境——原段落级 pattern 把市场级分位（跌停 20 日分位/成交额 60d 分位）
    # 与 PE 分位同段捆绑检查，对市场环境长文误报；规则本意 = 每条 PE/PB 分位
    # 陈述行内伴随中位/均值
    pattern: "^(?=.*(?:PE|PB|市盈率|市净率))(?=.*分位)(?=.*\\d+\\.?\\d*%)(?!.*中位数)(?!.*均值)(?!.*中位)"
    severity: "warning"
    scope: "line"
    message: "PE 分位数值应伴随中位数或均值，如 'PE 93.11x，近4年 98.3% 分位（中位数 37.52x）'"
    law_ref: "估值分位规则 — 分位数不单独使用"

  - id: "percentile-loss-label"
    pattern: "(?=.*(?:PE|PB|市盈率|市净率))分位.*\\d+\\.?\\d*%"
    severity: "info"
    scope: "line"
    message: "若标的为亏损期，需标注'该标的历史大部分时间微利/亏损，PE 分位数仅作位置参考，不反映估值贵贱'"
    law_ref: "估值分位规则 — 亏损期标的强制标注"

  # ==========================================================================
  # 结构检查 — [事实] / [分析] / [来源:]
  # ==========================================================================
  - id: "structure-missing-fact"
    pattern: "\\[事实\\]"
    severity: "info"
    scope: "file"
    message: "报告中应包含 [事实] 块引用数据来源"
    law_ref: "SOP-QC — 分析标记规范"

  - id: "structure-missing-analysis"
    pattern: "\\[分析\\]"
    severity: "info"
    scope: "file"
    message: "报告中应包含 [分析] 块（基于事实的逻辑推演）"
    law_ref: "SOP-QC — 分析标记规范"

  - id: "structure-missing-evidence-tag"
    pattern: "\\[证据强度"
    severity: "warning"
    scope: "file"
    message: "报告中应包含 [证据强度:] 四维标注（SOP-EV）"
    law_ref: "SOP-QC — 证据强度标注"

  - id: "structure-missing-source-tag"
    pattern: "\\[来源:"
    severity: "info"
    scope: "file"
    message: "数据来源段落应标注 [来源:] 标签"
    law_ref: "SOP-QC — 来源标注"

  # ==========================================================================
  # 文件名格式验证
  # scope=filename 语义：不匹配 pattern → 记 finding。
  # 因此只能保留一条「推荐格式」规则；勿再叠加旧格式 pattern，否则会误伤正确新文件名。
  # ==========================================================================
  - id: "filename-format-datetime"
    pattern: "^\\d{4}-\\d{2}-\\d{2}-\\d{2}-\\d{2}-\\d{2}\\.md$"
    severity: "info"
    scope: "filename"
    message: "推荐路径格式：{symbol}-{name}/{YYYY-MM-DD-HH-MM-SS}.md（如 600176-中国巨石/2026-07-22-14-30-05.md）"
    law_ref: "报告路径 — 个股报告命名规范"

  # ==========================================================================
  # 已知违规模式补充
  # ==========================================================================
  - id: "known-violation-buy-sell-advice-combo"
    pattern: "(买入|卖出|持有)该(股票|标的|公司|股份)"
    severity: "error"
    scope: "line"
    message: "禁止'买入/卖出/持有该标的'建议词汇（LAW 6）"
    law_ref: "LAW 6 — 已知违规模式 #2"

  - id: "known-violation-ting-pai"
    pattern: "建议(买入|卖出|持有|回避)"
    severity: "error"
    scope: "line"
    message: "禁止任何形式的'建议'指令（LAW 6）"
    law_ref: "LAW 6"

  - id: "known-violation-target-price-amount"
    pattern: "目标(价|位)[：:]*\\s*\\d+[\\.\\d]*\\s*(元|美元|港元|港币)"
    severity: "error"
    scope: "line"
    message: "禁止给出单一目标价（LAW 6），应提供估值区间"
    law_ref: "LAW 6 — 已知违规模式 #3"

  # ==========================================================================
  # 占位残留检查（原 check_report.sh 检查项 3）
  # ==========================================================================
  - id: "placeholder-todo"
    pattern: "(TODO|FIXME|XXX)"
    severity: "warning"
    scope: "line"
    message: "报告中存在待办标记（TODO/FIXME/XXX），请清理后再提交"
    law_ref: "SOP-QC — 占位残留"

  - id: "placeholder-zhanwei"
    pattern: "占位"
    severity: "warning"
    scope: "line"
    message: "报告中存在占位文本，请补充完整后再提交"
    law_ref: "SOP-QC — 占位残留"

  - id: "placeholder-tbd"
    pattern: "\\bTBD\\b"
    severity: "warning"
    scope: "line"
    message: "报告中存在待定标记（TBD），请补充后再提交"
    law_ref: "SOP-QC — 占位残留"

  - id: "placeholder-pause"
    pattern: "⏸"
    severity: "warning"
    scope: "line"
    message: "报告中存在占位标记（⏸），请补充完整"
    law_ref: "SOP-QC — 占位残留"

  - id: "placeholder-tofill"
    pattern: "(待补充|待填|待补)"
    severity: "warning"
    scope: "line"
    message: "报告中存在待补充字段，请补充完整"
    law_ref: "SOP-QC — 占位残留"

  # F0-3 修复：引擎占位符与异常泄漏直出报告是 P0 级问题（半成品/错误信息
  # 直接面向用户），error 级拦截——未人工加工的报告无法通过任何准出门。
  - id: "placeholder-engine-slot"
    pattern: "(\\[待 Claude|\\[待填充|Claude report 阶段|Claude 填写)"
    severity: "error"
    scope: "line"
    message: "引擎占位符未填（Claude 加工未完成），禁止直出报告"
    law_ref: "SOP-QC — 占位残留（F0-3）"

  - id: "error-leakage"
    pattern: "(has no attribute|AttributeError|TypeError|Traceback \\(most recent call last\\)|KeyError:)"
    severity: "error"
    scope: "line"
    message: "异常/错误信息泄漏进报告正文，需删除或替换为「不可得（原因）」"
    law_ref: "SOP-QC — 异常泄漏（F0-3）"

  # ==========================================================================
  # 绝对化表述检查（原 check_report.sh 检查项 5）
  # ==========================================================================
  - id: "wording-absolute-biran"
    pattern: "(?<!不)(?<!未必)(?<!并非)(?<!绝非)必然(?!性|规律|事件|趋势|联系|关系|因果|条件)"
    severity: "warning"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|不代表|不等于|⚠️|\\[来源:|^\\|.*\\|$)"
    message: "避免绝对化表述'必然'；若为引用来源内容请标注 [来源:]"
    law_ref: "措辞规范 — 绝对化表述"

  - id: "wording-absolute-yiding"
    pattern: "(?<!不)(?<!未必)(?<!并非)(?<!绝非)一定(?!程度|范围|条件|比例|意义|影响|作用|关系|差异|时间|期限|波动|风险|收益|承接|对冲|预期|相关性|安全边际|议价权|稀释|非经常性|定价|性|缓冲|支撑|价)"
    severity: "warning"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|不代表|不等于|⚠️|\\[来源:|^\\|.*\\|$)"
    skip_if_pattern_within_window: "(如果|若)"
    context_before: 1
    context_after: 1
    message: "避免绝对化表述'一定'；若为引用来源内容请标注 [来源:]"
    law_ref: "措辞规范 — 绝对化表述"

  - id: "wording-absolute-kending"
    pattern: "(?<!不)肯定(?!了|地|的)"
    severity: "warning"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|⚠️|\\[来源:|^\\|.*\\|$)"
    message: "避免绝对化表述'肯定'；若为引用来源内容请标注 [来源:]"
    law_ref: "措辞规范 — 绝对化表述"

  - id: "wording-absolute-juebu"
    pattern: "绝不"
    severity: "warning"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|⚠️|\\[来源:|^\\|.*\\|$)"
    message: "避免绝对化表述'绝不'；若为引用来源内容请标注 [来源:]"
    law_ref: "措辞规范 — 绝对化表述"

  - id: "wording-absolute-haowuyiwen"
    pattern: "毫无疑问"
    severity: "warning"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|⚠️|\\[来源:|^\\|.*\\|$)"
    message: "避免绝对化表述'毫无疑问'；若为引用来源内容请标注 [来源:]"
    law_ref: "措辞规范 — 绝对化表述"

  - id: "wording-absolute-yidingbu"
    pattern: "一定不会"
    severity: "warning"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|⚠️|\\[来源:|^\\|.*\\|$)"
    message: "避免绝对化表述'一定不会'；若为引用来源内容请标注 [来源:]"
    law_ref: "措辞规范 — 绝对化表述"

  - id: "wording-absolute-jueduibu"
    pattern: "绝对不会"
    severity: "warning"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|⚠️|\\[来源:|^\\|.*\\|$)"
    message: "避免绝对化表述'绝对不会'；若为引用来源内容请标注 [来源:]"
    law_ref: "措辞规范 — 绝对化表述"

  # ==========================================================================
  # [事实]/[分析] 顺序检查（原 check_report.sh 检查项 4）
  # 逐行扫描：每个 [分析] 前 50 行内须有 [事实]，遇 ## 章节标题停止回溯
  # ==========================================================================
  - id: "structure-analysis-without-fact"
    pattern: "\\[分析\\]"
    severity: "error"
    scope: "line"
    require_pattern_within_previous_lines: "\\[事实\\]"
    lookback_lines: 50
    stop_at_section_header: true
    message: "[分析] 段落前缺少 [事实] 块（SOP-QC 要求先列事实再分析）"
    law_ref: "SOP-QC — 分析标记规范"

  # ==========================================================================
  # LAW 17 — 结论先行金字塔结构（标题即论点、段首主旨句、逻辑链闭环）
  # ==========================================================================
  - id: "law17-noun-section-title"
    pattern: "^##\\s+[0-9一二三四五六七八九十][、.]?\\s*(公司画像|经营质量|估值位置|资金与筹码|技术结构|事件催化|研究问题卡|当前状态快照|动态驱动分析|市场结构分析|静态基本面分析|市场分歧|左侧.*右侧.*判断|风险与不确定性|附录|执行摘要|机构观点与盈利预测|研究快照|基础参数|核心财务数据.*最近一期|历史估值位置|盈利收益率.*要求回报率|Fed Model)\\s*$"
    severity: "warning"
    scope: "line"
    message: "标题应为完整判断句而非名词短语（LAW 17 — 标题即论点）。正确示例：'PE 55.5x 处 98.4% 分位，已定价乐观预期'"
    law_ref: "LAW 17"

  - id: "law17-process-module-title"
    pattern: "^##\\s*模块\\d"
    severity: "warning"
    scope: "line"
    message: "禁止使用'模块1/模块2'等流程性标题（LAW 17），应改为结论句如'PE 36.5x 处 98% 分位，已定价乐观预期'"
    law_ref: "LAW 17"

  - id: "law17-no-conclusion-sentence"
    pattern: "\\*\\*结论：\\*\\*"
    severity: "warning"
    scope: "file"
    message: "报告中缺少段首主旨句（**结论：**）（LAW 17），每个分析段落第一句应为加粗主旨句"
    law_ref: "LAW 17"

  - id: "law17-no-logic-chain"
    pattern: "\\*\\*逻辑链：\\*\\*"
    severity: "info"
    scope: "file"
    message: "报告中缺少数据→推理→判断逻辑链标注（**逻辑链：**）（LAW 17）"
    law_ref: "LAW 17"

  # ==========================================================================
  # 结论段证据等级兜底（v0.2.8，R-A2）
  # ==========================================================================
  - id: "wording-conclusion-evidence-fallback"
    # 全量审查 P1-2：支持「核心结论」标题形态 + 子弹前缀断言 + 同线证据标签
    # （同线 [来源: …] 是自然合规形态——旧实现只查前文行导致同线误报、
    # bullet 前缀漏检）
    pattern: "(?:^|[-*]\\s+)(主要|核心)?结论"
    severity: "error"
    scope: "line"
    require_pattern_within_previous_lines: "\\[证据?强度?:|\\[来源:"
    require_allow_same_line: true
    lookback_lines: 60
    message: "主要结论段内断言必须在文段内附证据标签（[来源: / [证据: / [证据强度:），无 ≥C 级证据不得入结论段（R-A2）"
    law_ref: "report-conventions §3 — 证据等级与结论强度解耦"

  # ==========================================================================
  # 点位证据等级红线（v0.2.6，来源 ABCD 调研 §1.3 红线表 + report-conventions §2.4）
  # 只拦断言式（将/必/必然 + 点位动作），不拦事实句（"已回补/未回补/回补非必然"）
  # ==========================================================================
  - id: "wording-level-gap-fill"
    pattern: "(将回补缺口|必将回补|必然回补|回补是必然|必回补)"
    severity: "error"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|非必然|不必然|\\[来源:|⚠️)"
    message: "禁止断言'缺口将/必然回补'（JBEF 2020：缺口后沿缺口方向延续；A 股一字板缺口结构性不回补）。允许：'缺口带未回补已 N 日（记录性事实；回补非必然）'"
    law_ref: "report-conventions §2.4 — 点位红线"

  - id: "wording-level-ma-retest"
    pattern: "(将回踩|必回踩|将测试(MA|均线)|必测试(MA|均线))"
    severity: "error"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|非必然|不必然|\\[来源:|⚠️)"
    message: "禁止断言'价格将回踩/测试 MA20'（STW 1999 Reality Check 校正后消失；PBFJ 2024 中国样本外转负）。允许：'当前价 vs MA20 偏离 X%'状态描述"
    law_ref: "report-conventions §2.4 — 点位红线"

  - id: "wording-level-boll-rebound"
    pattern: "(BOLL[^。\\n]{0,8}上轨[^。\\n]{0,10}(将|必(然)?)回调|上轨将回调)"
    severity: "error"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|非必然|不必然|\\[来源:|⚠️)"
    message: "禁止断言'触及 BOLL 上轨将回调'（Taiwan 50 实证：上轨应追势非反转，Physica A 2020）。允许：boll_position_pct 位置描述"
    law_ref: "report-conventions §2.4 — 点位红线"

  - id: "wording-level-fib-support"
    pattern: "((斐波|黄金分割)位[^。\\n]{0,12}(有)?(支撑|压力|阻力)|\\d+(\\.\\d+)?%\\s*回撤位[^。\\n]{0,12}(有)?(支撑|压力|阻力))"
    severity: "error"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|无预测性|无实证|无支撑|没有支撑|无压力|没有压力|无阻力|没有阻力|\\[来源:|⚠️)"
    message: "禁止断言'斐波回撤位有支撑/压力'（Tsinaslanidis 2022：与随机位点统计不可区分，L3 习俗）。允许：并列展示 + 强制 L3 习俗标签"
    law_ref: "report-conventions §2.4 — 点位红线"

  - id: "wording-level-round-number"
    pattern: "(整数关口[^。\\n]{0,10}(将|必(然)?|必定)(受阻|突破|失守|支撑)|关口(将|必(然)?|必定)(受阻|突破|失守|支撑))"
    severity: "error"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|非必然|不必然|\\[来源:|⚠️)"
    message: "禁止断言'整数关口必然受阻/突破'（自我实现机制：有效但非决定性，Frankel & Froot 1990）。允许：'4000 为市场关注位（中国实证：熊市效应最强）[证据: L1-2]'"
    law_ref: "report-conventions §2.4 — 点位红线"

  - id: "wording-level-wave-stop"
    pattern: "([0-9一二三四五六七八九十]+浪[^。\\n]{0,10}(回撤|调整)将止于|波浪[^。\\n]{0,10}将止于)"
    severity: "error"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|\\[来源:|⚠️)"
    message: "禁止断言'X 浪回撤将止于 Y%'（波浪理论不可证伪，Energy Policy 2018；L3 习俗仅展示）"
    law_ref: "report-conventions §2.4 — 点位红线"

  # ==========================================================================
  # 宏观外推红线（v0.2.7，来源 requirements-macro-cross-asset §0 C6-C11 + E5）
  # 只拦整体断言/无口径表述/无证据等级传导链/无 staleness 月频数据；
  # 「X 项中 Y 项成立」、条件限定句、带证据等级/口径/staleness 标注句豁免
  # ==========================================================================
  - id: "wording-macro-all-time-high"
    pattern: "(全线|整体|全部|所有|多国)[^。；\\n]{0,12}?新高"
    severity: "error"
    scope: "line"
    skip_if_pattern: "(项中.{0,8}项(成立|创|为)|并非|不是|不代表|风险提示|免责声明|\\[来源:)"
    message: "禁止'全线/整体创新高'类整体断言（C6），须逐项复算并输出'X 项中 Y 项成立'+ 各自当前值/最高值/最高值日期"
    law_ref: "report-conventions §3.2 #12（C6 观念修正）"

  - id: "wording-macro-no-top"
    pattern: "(理论上|从理论上讲|理论上来讲)[^。；\\n]{0,10}?无[^。；\\n]{0,6}?(顶部|上限)|无价格顶部|(长期|中期)[^。；\\n]{0,8}?方向(不会|不(会)?)(变|改变|逆转)|长期(上涨|向上)?方向不变"
    severity: "error"
    scope: "line"
    skip_if_pattern: "(并非|不代表|不能|不可|风险提示|免责声明|\\[来源:)"
    message: "禁止'理论上无顶部/长期方向不变'（C8），需求侧支撑与价格结论须分离表述（金价历史高位后均值回归显著，Erb & Harvey 2013：1980 峰值 850 → 1999 谷底 252.80，-86.1%）"
    law_ref: "report-conventions §3.2 #13（C8 观念修正）"

  - id: "wording-macro-fundamentals"
    pattern: "(不纠结|不必纠结|无需纠结)[^。；\\n]{0,6}?基本面|基本面[^。；\\n]{0,8}?(不重要|意义有限|意义不大|作用有限|无意义)|个股[^。；\\n]{0,6}?α[^。；\\n]{0,6}?被[^。；\\n]{0,4}?β[^。；\\n]{0,4}?淹没|α[^。；\\n]{0,4}?被[^。；\\n]{0,4}?β[^。；\\n]{0,4}?淹没"
    severity: "error"
    scope: "line"
    skip_if_pattern: "(在高同步性板块|高同步性|条件限定|风险提示|免责声明|\\[来源:)"
    message: "禁止'基本面短期意义有限/不重要/不纠结基本面'（C7），须改为带条件限定的方差归属表述：'在高同步性板块+短窗口（日/周）+高波动市态下收益方差由板块成分主导；基本面在中长期/低同步性个股/横截面定价/剧烈回调尾部中恢复意义'"
    law_ref: "report-conventions §3.2 #14（C7 观念修正）"

  - id: "wording-macro-distance-no-criterion"
    pattern: "(距|较|离|距离)(前高|历史高(点)?|区间高(点)?|本轮高(点)?|历史峰)[^。；\\n]{0,24}?\\d+(\\.\\d+)?(\\s*[-~—至]\\s*\\d+(\\.\\d+)?)?%"
    severity: "error"
    scope: "line"
    skip_if_pattern: "(收益率口径|价格口径|口径为|口径：|窗口|起止|截至|\\[来源:)"
    message: "'距前高 X%'必须标注口径（收益率 vs 价格）+ 窗口起止日（C10：两口径差异可达 67 倍），如'距前高 -10.07%（收益率口径，2025-11 至 2026-06 窗口）'"
    law_ref: "report-conventions §3.2 #15（C10 观念修正）"

  - id: "wording-macro-chain-evidence"
    pattern: "(?=.*(美债|美元|中东|油价|原油|通胀|利率|金价|黄金|AI 融资|AI融资|国债|收益率|美股|纳斯达克|美联储))[^→\\n]{1,16}→[^→\\n]{1,16}→[^→\\n]{1,16}"
    severity: "error"
    scope: "line"
    skip_if_pattern: "(证据等级|证据级别|证据强度|A 级|B 级|C 级|D 级|最弱环节|等权|风险提示|免责声明)"
    message: "传导链须逐环节标注证据等级（A/B/C/D），最弱环节（C/D 级）不得作核心论证（C9）。示例：'中东→美债：A 级（Weber 2018 JFE）；美债→AI 融资：C/D 级（无同行评审证据）；AI 融资→资产价格：B/C 级（中国样本正负并存）'"
    law_ref: "report-conventions §3.2 #16（C9 观念修正）"

  - id: "wording-staleness-monthly-overseas"
    pattern: "(英德法日|英国|德国|法国|日本)[ ]?(10Y|10 年|十年)[^。；\\n]{0,10}?(收益率|利率)[^。；\\n]{0,12}?\\d+(\\.\\d+)?%"
    severity: "error"
    scope: "line"
    skip_if_pattern: "(截至|滞后|据 FRED|据 akshare|风险提示|免责声明|\\[来源:)"
    message: "月频海外数据（英德法日 10Y 等）描述当期状况必须带 staleness 标注：'截至 YYYY-MM，滞后约 N 个月'（E5/E2，月频滞后约 2.5 个月）"
    law_ref: "report-conventions §3.2 #17（E5 staleness 强制）"

  # ==========================================================================
  # 负面信息淡化防规（v0.2.8，R-A5）——数据为负时禁止仅以正化表述
  # ==========================================================================
  - id: "wording-negative-softened-no-number"
    pattern: "(净流出|亏损|负增长|净减少|失血|下滑|下跌|回撤)[^。\\n]{0,12}(收窄|放缓|企稳|回暖|改善|好转)"
    severity: "error"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|\\[来源:|⚠️|\\d|%|亿|万|—)"
    message: "负面数据仅正化表述且无方向性数字——三态标注下负面信息必须带方向性数字（R-A5；王嘉鑫 2022：正面化语调与崩盘风险关联显著，deep-research 2.10）"
    law_ref: "report-conventions §3 — 负面信息淡化"
  - id: "wording-negative-softened-no-source"
    pattern: "(跌幅|流出|减少|下滑)[^。\\n]{0,10}(收窄|放缓|企稳)"
    severity: "warning"
    scope: "line"
    skip_if_pattern: "(风险提示|免责声明|不构成|\\[来源:|⚠️)"
    message: "负面改善表述无来源标注——须带 [来源: ...] 且数字为引擎/Python 计算（R-A5）"
    law_ref: "report-conventions §3 — 负面信息淡化"
