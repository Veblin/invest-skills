repos:
  - repo: local
    hooks:
      - id: sync-version-check
        name: version consistency (pyproject.toml → all derived files)
        entry: uv run python scripts/sync_version.py check
        language: system
        pass_filenames: false
        always_run: true
      - id: report-qc
        name: report quality check (unified: lint + structure + derived)
        entry: uv run python skills/lib/report_qc.py
        language: system
        pass_filenames: true
        files: ^reports/.*\.md$
        args: ["--profile", "precommit", "--fail-on", "warning"]
