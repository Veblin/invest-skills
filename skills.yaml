# Skills CLI manifest — https://github.com/antfu/skills-cli
# 安装: npx skills add Veblin/invest-skills
# 列出: npx skills add Veblin/invest-skills --list
# 单装: npx skills add Veblin/invest-skills --skill invest-a-stock

agents: [claude-code, codebuddy, qoder, qwen-code, trae, kimi-cli]

skills:
  - name: invest-a-stock
    description: A股多因子交叉验证的结构化投研助手 — 数据采集 + 学术级引用，产出带来源追溯的 Markdown 研究备忘录。研究工具，非决策工具。
    repo: Veblin/invest-skills
    skill: invest-a-stock

  - name: invest-a-pulse
    description: 市场情绪脉搏 — 杠杆周期/市场广度/极端情绪/资金面/估值温度 + 综合环境标签 + 交叉维度分析。研究工具，非择时工具。
    repo: Veblin/invest-skills
    skill: invest-a-pulse

  - name: invest-a-gap-scan
    description: A股跳空缺口扫描 — 向上缺口 + MA60 上方 + 未回补，指数成分股池（沪深300+中证A500+科创50）。研究工具，非决策工具。
    repo: Veblin/invest-skills
    skill: invest-a-gap-scan

  - name: invest-a-journal
    description: 交易日志 v2 — Claude 驱动四维评估（逻辑/盲点/仓位匹配/风险收益）+ 数据引擎；ETF 路径调用 invest-a-etf 共用模块。研究工具，非决策工具。
    repo: Veblin/invest-skills
    skill: invest-a-journal

  - name: invest-a-etf
    description: A股 ETF 结构化研究 — 指数估值/折溢价/AUM/跟踪质量/对冲覆盖，产出带来源追溯的研究备忘录。研究工具，非决策工具。
    repo: Veblin/invest-skills
    skill: invest-a-etf

  - name: invest-a-pattern-scan
    description: A股底部形态扫描 — LMW 双底/三角形底全市场检出 + 数据窥探防护（RC p）。研究工具，非决策工具。
    repo: Veblin/invest-skills
    skill: invest-a-pattern-scan

  - name: invest-hk-stock
    description: 港股数据引入与初步分析 — 腾讯/东财/百度三源快照、估值分位、财务摘要与港股风险层。研究工具，非决策工具。
    repo: Veblin/invest-skills
    skill: invest-hk-stock

  - name: invest-a-event-calendar
    description: 限售解禁压力日历 — 全市场逐日解禁家数/市值 + 未来 30 日高压日预警（近 120 日分位）。研究工具，非决策工具。
    repo: Veblin/invest-skills
    skill: invest-a-event-calendar

  - name: invest-a-forecast-scan
    description: 业绩预告雷达 — tushare forecast 全市场业绩预告扫描（预增/扭亏/首亏负面清单）。研究信号，非决策。
    repo: Veblin/invest-skills
    skill: invest-a-forecast-scan

  - name: invest-a-futures-link
    description: 商品期货→股票联动扫描 — 15 条产业链映射，期货与股票方向共振/背离对照。研究工具，非决策工具。
    repo: Veblin/invest-skills
    skill: invest-a-futures-link
